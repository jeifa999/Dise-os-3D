<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExtruLab 3D | Impresión 3D Personalizada y Cotizador Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#090D16',
              card: '#111827',
              border: '#1F2937',
              cyan: '#06B6D4',
              orange: '#F97316',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090D16;
      color: #F3F4F6;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(6, 182, 212, 0.08), transparent 35%),
        radial-gradient(circle at 85% 30%, rgba(249, 115, 22, 0.08), transparent 35%);
    }
    .grid-bg {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(55, 65, 81, 0.75);
    }
    /* Estilos para comparador Antes / Después */
    .ba-container {
      position: relative;
      overflow: hidden;
      user-select: none;
      touch-action: pan-y;
    }
    .ba-after {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ba-before-wrap {
      position: absolute;
      inset: 0;
      width: 50%;
      overflow: hidden;
      border-right: 2px solid #06B6D4;
    }
    .ba-before {
      width: 100%;
      height: 100%;
      object-fit: cover;
      max-width: none;
    }
    .ba-range {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: ew-resize;
      z-index: 20;
    }
    .ba-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      background: #06B6D4;
      color: #090D16;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
